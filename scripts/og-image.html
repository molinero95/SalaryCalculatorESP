<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        display: grid;
        place-items: center;
        background: #f4f4f1;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: #0b0b0b;
      }
      .frame {
        width: 1080px;
        display: grid;
        gap: 40px;
      }
      h1 {
        margin: 0;
        font-size: 76px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        font-size: 34px;
        color: #52514e;
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }
      .card {
        padding: 32px 36px;
        border-radius: 20px;
        background: #fcfcfb;
        border: 2px solid #dcdbd4;
        border-top: 10px solid var(--accent);
      }
      .chip {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .amount {
        margin-top: 18px;
        font-size: 60px;
        white-space: nowrap;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .delta {
        margin-left: 14px;
        padding: 4px 14px;
        border-radius: 10px;
        background: #e3f4ea;
        color: #0a7a3f;
        font-size: 26px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div>
        <h1>💶 Simulador de salario neto</h1>
        <p>Calcula tu nómina en España y compárala con cualquier propuesta fiscal</p>
      </div>
      <div class="cards">
        <div class="card" style="--accent: #2a78d6">
          <span class="chip">ACTUAL</span>
          <div class="amount">1.628,50 €</div>
        </div>
        <div class="card" style="--accent: #eb6834">
          <span class="chip">SIMULACIÓN</span>
          <div class="amount">1.657,86 €<span class="delta">+29,36 €</span></div>
        </div>
      </div>
    </div>
  </body>
</html>
