<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simulador de salario neto</title>
    <meta
      name="description"
      content="Calcula tu salario neto en España (IRPF y Seguridad Social) y simula cómo cambiaría con distintas propuestas fiscales."
    />
    <meta name="author" content="Jaime Molinero Lacave" />
    <link rel="canonical" href="https://molinero95.github.io/SalaryCalculatorESP/" />

    <!-- Link previews (WhatsApp, X, LinkedIn, Telegram…) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Simulador de salario neto" />
    <meta property="og:title" content="Simulador de salario neto" />
    <meta
      property="og:description"
      content="Calcula tu nómina en España y compárala con cualquier propuesta fiscal: tramos del IRPF, mínimos y cotizaciones."
    />
    <meta property="og:url" content="https://molinero95.github.io/SalaryCalculatorESP/" />
    <meta property="og:image" content="https://molinero95.github.io/SalaryCalculatorESP/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Comparativa de nómina actual y simulada" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2a78d6" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💶</text></svg>"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2a78d6" />
    <script type="module" src="js/app.js"></script>
    <!-- Privacy-friendly, cookie-free visit counter -->
    <script data-goatcounter="https://molinero95.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header-inner">
        <div>
          <h1 data-i18n="appTitle">Simulador de salario neto</h1>
          <p class="subtitle" data-i18n="appSubtitle"></p>
        </div>
        <select id="language" class="language-select" data-i18n-aria="language"></select>
      </div>
    </header>

    <main class="container">
      <section class="how-it-works" aria-labelledby="how-title">
        <h2 id="how-title" class="sr-only" data-i18n="howTitle"></h2>
        <ol>
          <li data-i18n="how1"></li>
          <li data-i18n="how2"></li>
          <li data-i18n="how3"></li>
        </ol>
      </section>

      <section class="card" aria-labelledby="details-title">
        <h2 id="details-title" data-i18n="yourDetails"></h2>
        <form id="details-form" class="details-form" autocomplete="off">
          <div class="field field-salary">
            <label for="salary" data-i18n="grossSalary"></label>
            <div class="input-unit">
              <input id="salary" name="salary" type="number" min="0" step="100" inputmode="decimal" />
              <span class="unit">€</span>
            </div>
          </div>

          <div class="field">
            <span class="label" data-i18n="period"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="period" value="annual" /><span data-i18n="annual"></span></label>
              <label><input type="radio" name="period" value="perPayment" /><span data-i18n="perPayment"></span></label>
            </div>
          </div>

          <div class="field">
            <span class="label"><span data-i18n="payments"></span><span data-help="helpPayments"></span></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="payments" value="12" /><span data-i18n="payments12"></span></label>
              <label><input type="radio" name="payments" value="14" /><span data-i18n="payments14"></span></label>
            </div>
          </div>

          <div class="field">
            <span class="label" data-i18n="contract"></span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="contract" value="permanent" /><span data-i18n="permanent"></span></label>
              <label><input type="radio" name="contract" value="temporary" /><span data-i18n="temporary"></span></label>
            </div>
          </div>

          <div class="field">
            <label for="familySituation"
              ><span data-i18n="familySituation"></span><span data-help="helpFamilySituation"></span
            ></label>
            <select id="familySituation" name="familySituation">
              <option value="3" data-i18n="situation3"></option>
              <option value="2" data-i18n="situation2"></option>
              <option value="1" data-i18n="situation1"></option>
            </select>
          </div>

          <div class="field">
            <label for="region"><span data-i18n="region"></span><span data-help="helpRegion"></span></label>
            <select id="region" name="region"></select>
          </div>

          <div class="field">
            <label for="city" data-i18n="cityPreset"></label>
            <select id="city" name="city"></select>
          </div>
          <div class="field field-full">
            <p class="help" data-i18n="cityPresetHelp"></p>
            <div class="toolbar" id="salary-examples" role="group" data-i18n-aria="salaryExamples"></div>
            <details>
              <summary data-i18n="locationBrackets"></summary>
              <div class="table-scroll" id="location-brackets" tabindex="0"></div>
            </details>
            <p class="help" id="fiscal-scope" role="status" hidden></p>
          </div>

          <div class="field">
            <label for="disability" data-i18n="disability"></label>
            <select id="disability" name="disability">
              <option value="0" data-i18n="disabilityNone"></option>
              <option value="33" data-i18n="disability33"></option>
              <option value="65" data-i18n="disability65"></option>
            </select>
          </div>

          <div class="field">
            <label for="age" data-i18n="age"></label>
            <input id="age" name="age" type="number" min="16" max="100" />
          </div>

          <div class="field">
            <label for="partTime"><span data-i18n="partTime"></span><span data-help="helpPartTime"></span></label>
            <div class="input-unit">
              <input id="partTime" name="partTime" type="number" min="1" max="100" step="1" />
              <span class="unit">%</span>
            </div>
          </div>

          <div class="field">
            <label for="children" data-i18n="children"></label>
            <input id="children" name="children" type="number" min="0" max="20" />
          </div>

          <div class="field">
            <label for="childrenUnder3" data-i18n="childrenUnder3"></label>
            <input id="childrenUnder3" name="childrenUnder3" type="number" min="0" max="20" />
          </div>

          <div class="field">
            <label for="dependents65" data-i18n="dependents65"></label>
            <input id="dependents65" name="dependents65" type="number" min="0" max="10" />
          </div>

          <div class="field">
            <label for="dependents75" data-i18n="dependents75"></label>
            <input id="dependents75" name="dependents75" type="number" min="0" max="10" />
          </div>

          <label class="checkbox field-wide">
            <input type="checkbox" name="childrenFullyCounted" />
            <span data-i18n="childrenFullyCounted"></span><span data-help="helpChildrenFullyCounted"></span>
          </label>

          <p class="warning field-wide" id="input-warning" role="alert" hidden></p>

          <details class="extras field-wide">
            <summary data-i18n="flexTitle"></summary>
            <p class="help" data-i18n="flexHelp"></p>
            <div class="field amounts-period">
              <span class="label" data-i18n="amountsIn"></span>
              <div class="segmented" role="radiogroup">
                <label><input type="radio" name="flexPeriod" value="annual" /><span data-i18n="annual"></span></label>
                <label><input type="radio" name="flexPeriod" value="monthly" /><span data-i18n="monthly"></span></label>
              </div>
            </div>
            <div class="fields">
              <div class="field">
                <label for="flexMeal" data-i18n="flexMeal"></label>
                <div class="input-unit">
                  <input id="flexMeal" name="flexMeal" type="number" min="0" step="10" inputmode="decimal" />
                  <span class="unit">€</span>
                </div>
              </div>
              <div class="field">
                <label for="workingDays" data-i18n="workingDays"></label>
                <input id="workingDays" name="workingDays" type="number" min="0" max="366" />
              </div>
              <div class="field">
                <label for="flexTransport" data-i18n="flexTransport"></label>
                <div class="input-unit">
                  <input id="flexTransport" name="flexTransport" type="number" min="0" step="10" inputmode="decimal" />
                  <span class="unit">€</span>
                </div>
              </div>
              <div class="field">
                <label for="flexHealth" data-i18n="flexHealth"></label>
                <div class="input-unit">
                  <input id="flexHealth" name="flexHealth" type="number" min="0" step="10" inputmode="decimal" />
                  <span class="unit">€</span>
                </div>
              </div>
              <div class="field">
                <label for="flexHealthPeople" data-i18n="flexHealthPeople"></label>
                <input id="flexHealthPeople" name="flexHealthPeople" type="number" min="1" max="15" />
              </div>
              <div class="field">
                <label for="flexChildcare" data-i18n="flexChildcare"></label>
                <div class="input-unit">
                  <input id="flexChildcare" name="flexChildcare" type="number" min="0" step="10" inputmode="decimal" />
                  <span class="unit">€</span>
                </div>
              </div>
              <div class="field">
                <label for="flexTraining" data-i18n="flexTraining"></label>
                <div class="input-unit">
                  <input id="flexTraining" name="flexTraining" type="number" min="0" step="10" inputmode="decimal" />
                  <span class="unit">€</span>
                </div>
              </div>
            </div>
            <p class="warning" id="flex-warning" role="alert" hidden></p>
          </details>

          <details class="extras field-wide">
            <summary data-i18n="pensionTitle"></summary>
            <p class="help" data-i18n="pensionHelp"></p>
            <div class="field amounts-period">
              <span class="label" data-i18n="amountsIn"></span>
              <div class="segmented" role="radiogroup">
                <label
                  ><input type="radio" name="pensionPeriod" value="annual" /><span data-i18n="annual"></span
                ></label>
                <label
                  ><input type="radio" name="pensionPeriod" value="monthly" /><span data-i18n="monthly"></span
                ></label>
              </div>
            </div>
            <div class="fields">
              <div class="field">
                <label for="pensionIndividual" data-i18n="pensionIndividual"></label>
                <div class="input-unit">
                  <input
                    id="pensionIndividual"
                    name="pensionIndividual"
                    type="number"
                    min="0"
                    step="10"
                    inputmode="decimal"
                  />
                  <span class="unit">€</span>
                </div>
              </div>
              <div class="field">
                <label for="pensionEmployee" data-i18n="pensionEmployee"></label>
                <div class="input-unit">
                  <input
                    id="pensionEmployee"
                    name="pensionEmployee"
                    type="number"
                    min="0"
                    step="10"
                    inputmode="decimal"
                  />
                  <span class="unit">€</span>
                </div>
              </div>
              <div class="field">
                <label for="pensionEmployer" data-i18n="pensionEmployer"></label>
                <div class="input-unit">
                  <input
                    id="pensionEmployer"
                    name="pensionEmployer"
                    type="number"
                    min="0"
                    step="10"
                    inputmode="decimal"
                  />
                  <span class="unit">€</span>
                </div>
              </div>
            </div>
          </details>
        </form>
      </section>

      <details class="card card-simulation collapsible" open>
        <summary>
          <h2 id="simulation-title" class="section-title">
            <span class="chip chip-simulation" data-i18n="simulation"></span><span data-i18n="simTitle"></span>
          </h2>
        </summary>
        <p class="help" data-i18n="simDesc"></p>
        <div class="sim-tabs" role="group" data-i18n-aria="compareTitle" id="sim-tabs"></div>

        <div class="field field-name">
          <label for="scenario-name" data-i18n="scenarioName"></label>
          <input id="scenario-name" type="text" maxlength="60" />
        </div>

        <div class="field field-name">
          <label for="proposal-select" data-i18n="loadProposal"></label>
          <select id="proposal-select"></select>
        </div>
        <div class="proposal-info" id="proposal-info" hidden></div>
        <details class="other-proposals">
          <summary data-i18n="otherProposals"></summary>
          <ul id="other-proposals"></ul>
          <p class="help" data-i18n="proposalsDisclaimer"></p>
        </details>

        <div class="toolbar">
          <button type="button" class="button secondary" id="copy-current" data-i18n="copyCurrent"></button>
          <button type="button" class="button" id="share" data-i18n="share"></button>
          <button type="button" class="button secondary" id="share-whatsapp">WhatsApp</button>
          <button type="button" class="button secondary" id="share-x">X</button>
          <button type="button" class="button secondary" id="share-native" data-i18n="shareNative" hidden></button>
          <button type="button" class="button secondary" id="export" data-i18n="exportJson"></button>
          <label class="button secondary">
            <span data-i18n="importJson"></span>
            <input type="file" id="import" accept="application/json,.json" hidden />
          </label>
        </div>

        <p class="help share-note" data-i18n="shareNote"></p>

        <div class="toolbar">
          <label for="saved-scenarios" data-i18n="myScenarios"></label>
          <select id="saved-scenarios"></select>
          <button type="button" class="button secondary" id="load-scenario" data-i18n="load"></button>
          <button type="button" class="button secondary" id="delete-scenario" data-i18n="delete"></button>
          <button type="button" class="button" id="save-scenario" data-i18n="save"></button>
        </div>

        <div id="settings-simulation" class="settings"></div>
      </details>

      <details class="card card-current collapsible">
        <summary>
          <h2 id="current-title" class="section-title">
            <span class="chip chip-current" data-i18n="current"></span><span data-i18n="currentTitle"></span>
          </h2>
        </summary>
        <p class="help" data-i18n="currentDesc"></p>
        <div class="toolbar">
          <button type="button" class="button secondary" id="reset-current" data-i18n="reset"></button>
        </div>
        <div id="settings-current" class="settings"></div>
      </details>

      <section aria-live="polite">
        <div class="results" id="results"></div>
        <p class="difference" id="difference"></p>
      </section>

      <section class="card" aria-labelledby="context-title">
        <h2 id="context-title" data-i18n="contextTitle"></h2>
        <div class="context-grid">
          <div>
            <p class="context-figure" id="percentile-text"></p>
            <div class="percentile-bar" aria-hidden="true"><span id="percentile-marker"></span></div>
            <p class="help" data-i18n="percentileSource"></p>
          </div>
          <div>
            <h3 data-i18n="creepTitle"></h3>
            <p id="creep-text"></p>
            <button type="button" class="button secondary" id="creep-simulate" data-i18n="creepSimulate"></button>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="chart-title">
        <div class="card-header">
          <h2 id="chart-title" data-i18n="chartTitle"></h2>
          <div class="segmented" role="radiogroup" id="chart-mode">
            <label><input type="radio" name="chartMode" value="diff" /><span data-i18n="chartDiff"></span></label>
            <label><input type="radio" name="chartMode" value="rate" /><span data-i18n="chartRate"></span></label>
          </div>
        </div>
        <p class="help" id="chart-description"></p>
        <div class="legend" id="chart-legend"></div>
        <div class="chart" id="chart"></div>
        <details class="data-table">
          <summary data-i18n="showTable"></summary>
          <div class="table-scroll" tabindex="0" id="chart-table"></div>
        </details>
      </section>

      <section class="card" aria-labelledby="compare-title">
        <h2 id="compare-title" data-i18n="compareTitle"></h2>
        <p class="help" data-i18n="compareDesc"></p>
        <div class="table-scroll" tabindex="0" id="compare-table"></div>
        <p class="help compare-chart-help" data-i18n="compareChartDesc"></p>
        <div class="legend" id="compare-legend"></div>
        <div class="chart" id="compare-chart"></div>
      </section>

      <section class="card" aria-labelledby="breakdown-title">
        <div class="card-header">
          <h2 id="breakdown-title" data-i18n="breakdown"></h2>
          <button type="button" class="button secondary no-print" id="print" data-i18n="print"></button>
        </div>
        <div class="table-scroll" tabindex="0" id="breakdown"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p data-i18n="disclaimer"></p>
        <p>
          © 2026 Jaime Molinero Lacave · MIT ·
          <a href="https://github.com/molinero95/SalaryCalculatorESP" data-i18n="sourceCode"></a>
        </p>
      </div>
    </footer>

    <div class="sticky-summary" id="sticky-summary" aria-hidden="true">
      <span class="sticky-label" data-i18n="stickyHint"></span>
      <strong id="sticky-value"></strong>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
